<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f8f8" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>
    
    <!-- Pattern for subtle texture -->
    <pattern id="pattern" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="50" cy="50" r="1" fill="#cccccc" fill-opacity="0.2" />
      <circle cx="25" cy="25" r="1" fill="#cccccc" fill-opacity="0.2" />
      <circle cx="75" cy="75" r="1" fill="#cccccc" fill-opacity="0.2" />
      <circle cx="25" cy="75" r="1" fill="#cccccc" fill-opacity="0.2" />
      <circle cx="75" cy="25" r="1" fill="#cccccc" fill-opacity="0.2" />
    </pattern>
  </defs>
  
  <!-- Base background with gradient -->
  <rect width="100%" height="100%" fill="url(#bg-gradient)" />
  
  <!-- Textured overlay -->
  <rect width="100%" height="100%" fill="url(#pattern)" />
  
  <!-- Abstract elements -->
  <path d="M0,200 Q960,120 1920,300" stroke="#eaeaea" stroke-width="250" fill="none" />
  <path d="M0,500 Q960,620 1920,400" stroke="#f0f0f0" stroke-width="200" fill="none" />
  <path d="M0,800 Q960,720 1920,900" stroke="#e8e8e8" stroke-width="300" fill="none" />
</svg>